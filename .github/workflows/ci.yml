name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check .
      - name: Relay agent tests
        run: python -m unittest discover -s agent -p "test_*.py"

  agent-oldest-python:
    # Shop PCs often run an old Python; the agent promises 3.8.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m unittest discover -s agent -p "test_*.py"

  frappe:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: comstore_etims
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install bench
        run: pip install frappe-bench
      - name: Set up bench with ERPNext v16
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench
          cd frappe-bench
          bench get-app --branch version-16 erpnext
          bench get-app $GITHUB_WORKSPACE/comstore_etims
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
      - name: Create site
        working-directory: frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' --install-app erpnext --install-app comstore_etims
          bench --site test_site set-config allow_tests true
      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app comstore_etims

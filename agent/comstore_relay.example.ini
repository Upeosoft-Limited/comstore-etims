; Copy to comstore_relay.ini beside comstore_relay.py and fill in.
; comstore_relay.ini holds secrets: keep it on this PC only.

[erpnext]
; The ERPNext site, over HTTPS.
url = https://your-site.example.com
; API key and secret of the device's Relay User (a user with only the Comstore Relay role).
api_key =
api_secret =
; The Comstore Device's serial number in ERPNext.
device = DEMO000000000001

[comstore]
; The ComstoreFC4Api service on this network.
url = http://127.0.0.1:4000
; The X-API-KEY shown by the ComstoreFC4Api app.
api_key =

[agent]
poll_seconds = 3
heartbeat_seconds = 60
batch = 5
device_timeout = 90
